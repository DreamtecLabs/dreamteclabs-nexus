name: Temporary Monitoring Format

on:
  pull_request:
    paths:
      - 'ui/src/nexus/monitoring.rs'
      - '.github/workflows/temporary-monitoring-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format monitoring source
        run: cargo fmt --manifest-path ui/Cargo.toml --all

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ui/src/nexus/monitoring.rs; then
            echo 'Monitoring source already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/src/nexus/monitoring.rs
          git commit -m 'fix(ui): format monitoring workspace'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
