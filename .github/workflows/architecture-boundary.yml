name: Architecture Boundary

on:
  pull_request:
    paths:
      - 'server/src/api/nexus/**'
      - 'ui/src/nexus/**'
      - 'nexus/**'
      - 'docs/architecture/**'
      - 'tools/nexus/check-pdm-provider-boundary.sh'
      - '.github/workflows/architecture-boundary.yml'

permissions:
  contents: read

jobs:
  pdm-provider-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce PDM provider boundary
        shell: bash
        run: bash tools/nexus/check-pdm-provider-boundary.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
