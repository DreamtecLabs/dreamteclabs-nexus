name: Apply inventory interaction fix

on:
  push:
    branches:
      - fix/inventory-native-interactions
    paths:
      - .github/workflows/apply-inventory-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inventory-native-interactions
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 tools/nexus/patch-inventory-interactions.py
      - name: Remove temporary patch machinery
        run: rm tools/nexus/patch-inventory-interactions.py .github/workflows/apply-inventory-fix.yml
      - name: Commit patched Inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(inventory): classify native actions and capture row clicks"
          git push origin HEAD:fix/inventory-native-interactions
