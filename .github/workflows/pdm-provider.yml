name: PDM Provider

on:
  pull_request:
    paths:
      - 'server/src/api/pve/**'
      - 'server/src/connection.rs'
      - 'tools/nexus/build-backend-container.sh'
      - '.github/workflows/pdm-provider.yml'
  push:
    branches:
      - master
    paths:
      - 'server/src/api/pve/**'
      - 'server/src/connection.rs'
      - 'tools/nexus/build-backend-container.sh'
      - '.github/workflows/pdm-provider.yml'
  workflow_dispatch:

concurrency:
  group: pdm-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          submodules: recursive
      - name: Check Rust formatting
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rust:latest sh -c 'rustup component add rustfmt && cargo fmt --all -- --check'
      - name: Restore backend Cargo target
        uses: actions/cache/restore@v4
        with:
          path: .cache/backend-target
          key: pdm-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pdm-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ env.SOURCE_SHA }}-
            pdm-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build PDM backend package
        id: package_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cache/backend-target" artifacts
          docker run --rm \
            --label nexus-ci-build=1 \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_BUILD_JOBS=2 \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_TARGET_DIR=/cargo-cache/target \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/.cache/backend-target:/cargo-cache" \
            -w /workspace \
            debian:trixie \
            bash tools/nexus/build-backend-container.sh 2>&1 | tee artifacts/backend-build.log
      - name: Save backend Cargo target
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/backend-target
          key: pdm-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish PDM build failure diagnostics
        if: steps.package_build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('artifacts/backend-build.log', 'utf8');
            const lines = log.split(/\r?\n/);
            const errorStart = lines.findLastIndex(line => /(^|\s)(error(\[E\d+\])?:|error: could not compile|make(\[\d+\])?: \*\*\*|Killed|exit code)/.test(line));
            const start = errorStart >= 0 ? Math.max(0, errorStart - 45) : Math.max(0, lines.length - 160);
            const excerpt = lines.slice(start, Math.min(lines.length, start + 160)).join('\n').slice(-50000);
            const marker = '<!-- pdm-provider-build-diagnostics -->';
            const body = `${marker}\n### PDM Provider build diagnostics\n\nHead: \`${process.env.SOURCE_SHA}\`\n\n\`\`\`text\n${excerpt}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: Fail when backend package build fails
        if: steps.package_build.outcome == 'failure'
        run: exit 1
      - name: Validate artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/backend/BUILD_COMMIT)" = "$SOURCE_SHA"
          (cd artifacts/backend && sha256sum --check SHA256SUMS)
          dpkg-deb --info artifacts/backend/proxmox-datacenter-manager_*.deb >/dev/null
      - name: Upload commit-addressed PDM backend
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pdm-backend-${{ env.SOURCE_SHA }}
          path: |
            artifacts/backend/*.deb
            artifacts/backend/SHA256SUMS
            artifacts/backend/BUILD_COMMIT
          if-no-files-found: error
          retention-days: 30
