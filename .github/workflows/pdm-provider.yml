name: PDM Provider

on:
  pull_request:
    paths:
      - 'server/src/api/pve/**'
      - 'server/src/connection.rs'
      - 'tools/nexus/build-backend-container.sh'
      - '.github/workflows/pdm-provider.yml'
  push:
    branches:
      - master
    paths:
      - 'server/src/api/pve/**'
      - 'server/src/connection.rs'
      - 'tools/nexus/build-backend-container.sh'
      - '.github/workflows/pdm-provider.yml'
  workflow_dispatch:

concurrency:
  group: pdm-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-package:
    # The PDM Debian build is CPU/RAM intensive. Running it on the shared
    # homelab runners caused multi-hour queues, runner contention and SIGKILLs.
    # Use an isolated GitHub-hosted runner so this provider gate is predictable.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Check Rust formatting
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rust:latest sh -c 'rustup component add rustfmt && cargo fmt --all -- --check'
      - name: Restore backend Cargo target
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/backend-target
          key: pdm-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pdm-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-
            pdm-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build PDM backend package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cache/backend-target"
          docker run --rm \
            --label nexus-ci-build=1 \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_BUILD_JOBS=1 \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_TARGET_DIR=/cargo-target \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/.cache/backend-target:/cargo-target" \
            -w /workspace \
            debian:trixie \
            bash tools/nexus/build-backend-container.sh
      - name: Save backend Cargo target
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/backend-target
          key: pdm-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/backend/BUILD_COMMIT)" = "$GITHUB_SHA"
          (cd artifacts/backend && sha256sum --check SHA256SUMS)
          dpkg-deb --info artifacts/backend/proxmox-datacenter-manager_*.deb >/dev/null
      - name: Upload commit-addressed PDM backend
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pdm-backend-${{ github.sha }}
          path: |
            artifacts/backend/*.deb
            artifacts/backend/SHA256SUMS
            artifacts/backend/BUILD_COMMIT
          if-no-files-found: error
          retention-days: 30
