name: Nexus Core

on:
  pull_request:
    paths:
      - 'nexus/**'
      - 'docs/architecture/**'
      - '.github/workflows/nexus-core.yml'
      - 'README.md'
      - '.gitignore'
  push:
    branches:
      - master
    paths:
      - 'nexus/**'
      - 'docs/architecture/**'
      - '.github/workflows/nexus-core.yml'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: nexus-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nexus/pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: pytest

      - name: Validate deployment scripts
        run: |
          bash -n deploy.sh deploy-native.sh
          test -x deploy.sh
          test -x deploy-native.sh

      - name: Validate compose
        run: docker compose -f compose.yaml config --quiet

      - name: Build container
        run: docker build -t dreamteclabs-nexus-core:${GITHUB_SHA} .
