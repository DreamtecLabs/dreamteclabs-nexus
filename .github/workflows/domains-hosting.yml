name: Domains & Hosting

on:
  pull_request:
    paths:
      - 'server/src/api/nexus/**'
      - 'server/src/api/mod.rs'
      - 'services/nexus-domains-helper'
      - 'services/Makefile'
      - 'debian/proxmox-datacenter-manager.install'
      - 'docs/nexus-domains-hosting.md'
      - 'ui/src/nexus/domains.rs'
      - 'ui/src/nexus/mod.rs'
      - 'ui/src/main_menu.rs'
      - '.github/workflows/domains-hosting.yml'
  push:
    branches:
      - master
    paths:
      - 'server/src/api/nexus/**'
      - 'server/src/api/mod.rs'
      - 'services/nexus-domains-helper'
      - 'services/Makefile'
      - 'debian/proxmox-datacenter-manager.install'
      - 'docs/nexus-domains-hosting.md'
      - 'ui/src/nexus/domains.rs'
      - 'ui/src/nexus/mod.rs'
      - 'ui/src/main_menu.rs'
      - '.github/workflows/domains-hosting.yml'
  workflow_dispatch:

concurrency:
  group: domains-hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      # Do not inherit a host-level Cargo source replacement from the self-hosted
      # runner (for example Debian's /usr/share/cargo/registry directory source).
      # CI must resolve dependencies from the project's normal Cargo registry.
      CARGO_HOME: ${{ runner.temp }}/nexus-domains-cargo
    steps:
      - name: Recover workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            sh -c 'chown -R "$HOST_UID:$HOST_GID" /workspace'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check helper syntax
        run: bash -n services/nexus-domains-helper

      - name: Enforce hostname ownership guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'forbid_webmail_ddns' server/src/api/nexus/domains.rs
          grep -q 'forbid_mail_proxy' server/src/api/nexus/domains.rs
          grep -q 'webmail hostname is still DDNS-managed' services/nexus-domains-helper
          if grep -Eq 'cf_upsert_single_dns .* A .*mail_host' services/nexus-domains-helper; then
            echo 'mail.* A records must remain DDNS-owned' >&2
            exit 1
          fi

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test domains API unit tests
        run: cargo test -p server api::nexus::domains::tests --lib

      - name: Check server compilation
        run: cargo check -p server
