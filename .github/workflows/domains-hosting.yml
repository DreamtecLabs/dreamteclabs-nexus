name: Domains & Hosting

on:
  pull_request:
    paths:
      - 'server/src/api/nexus/**'
      - 'server/src/api/mod.rs'
      - 'services/nexus-domains-helper'
      - 'services/Makefile'
      - 'debian/proxmox-datacenter-manager.install'
      - 'docs/nexus-domains-hosting.md'
      - 'tools/nexus/validate-domains-ci.sh'
      - 'tools/nexus/validate-domains-container.sh'
      - 'ui/src/nexus/domains.rs'
      - 'ui/src/nexus/mod.rs'
      - 'ui/src/main_menu.rs'
      - '.github/workflows/domains-hosting.yml'
  push:
    branches:
      - master
    paths:
      - 'server/src/api/nexus/**'
      - 'server/src/api/mod.rs'
      - 'services/nexus-domains-helper'
      - 'services/Makefile'
      - 'debian/proxmox-datacenter-manager.install'
      - 'docs/nexus-domains-hosting.md'
      - 'tools/nexus/validate-domains-ci.sh'
      - 'tools/nexus/validate-domains-container.sh'
      - 'ui/src/nexus/domains.rs'
      - 'ui/src/nexus/mod.rs'
      - 'ui/src/main_menu.rs'
      - '.github/workflows/domains-hosting.yml'
  workflow_dispatch:

concurrency:
  group: domains-hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Recover workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            sh -c 'chown -R "$HOST_UID:$HOST_GID" /workspace'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate policy and formatting
        shell: bash
        run: bash tools/nexus/validate-domains-ci.sh

      - name: Test and compile in Debian Trixie
        shell: bash
        run: |
          docker run --rm \
            --memory=7g \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:trixie \
            bash tools/nexus/validate-domains-container.sh
