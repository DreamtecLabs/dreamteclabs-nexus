name: Apply native Inventory guest panel integration

on:
  push:
    branches:
      - fix/inventory-native-guest-panel
    paths:
      - .github/workflows/apply-native-guest-panel.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inventory-native-guest-panel
          fetch-depth: 0
      - name: Patch GuestPanel and Nexus Inventory
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          guests = Path('ui/src/guests.rs')
          text = guests.read_text()

          text = text.replace(
              'use pwt::widget::form::Field;\nuse pwt::widget::{',
              'use pwt::widget::form::Field;\nuse pwt::widget::menu::{Menu, MenuButton, MenuItem};\nuse pwt::widget::{',
              1,
          )

          old = '''#[derive(Clone, PartialEq, Properties)]
