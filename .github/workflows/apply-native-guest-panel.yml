name: Apply native Inventory guest panel integration

on:
  push:
    branches:
      - fix/inventory-native-guest-panel
    paths:
      - .github/workflows/apply-native-guest-panel.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inventory-native-guest-panel
          fetch-depth: 0
      - name: Enable native GuestPanel for Nexus Inventory
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('ui/src/nexus/inventory.rs')
          text = path.read_text()
          old = 'VNode::from(GuestPanel::new())'
          new = 'VNode::from(GuestPanel::nexus())'
          if old not in text:
              raise SystemExit('Nexus GuestPanel call not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path ui/Cargo.toml --all
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-native-guest-panel.yml
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/nexus/inventory.rs .github/workflows/apply-native-guest-panel.yml
          git commit -m "fix(inventory): enable native Nexus GuestPanel"
          git push origin HEAD:fix/inventory-native-guest-panel
