'''
          if old not in text:
              raise SystemExit('GuestPanel block not found')
          text = text.replace(old, new, 1)

          old = '''    fn guest_info(&self) -> GuestInfo {
        GuestInfo {
            guest_type: self.guest_type(),
            vmid: self.vmid(),
        }
