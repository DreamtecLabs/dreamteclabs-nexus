name: Nexus UI

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'server/src/api/nexus/**'
      - 'server/src/api/mod.rs'
      - 'tools/nexus/**'
      - 'docs/nexus-frontend-architecture.md'
      - '.github/workflows/nexus-ui.yml'
  push:
    branches:
      - master
    paths:
      - 'ui/**'
      - 'server/src/api/nexus/**'
      - 'server/src/api/mod.rs'
      - 'tools/nexus/**'
      - 'docs/nexus-frontend-architecture.md'
      - '.github/workflows/nexus-ui.yml'
  workflow_dispatch:

concurrency:
  group: nexus-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  boundary:
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      ui_changed: ${{ steps.changes.outputs.ui_changed }}
    steps:
      - name: Recover workspace ownership
        shell: bash
        run: |
          set -euo pipefail

          # Only stop a stale Nexus build that is mounted on this runner
          # agent's workspace. Multiple runner agents can share one host;
          # killing every nexus-ci-build container can terminate a healthy
          # build owned by another agent and surfaces as exit 137.
          while read -r cid; do
            [[ -n "$cid" ]] || continue
            source="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/workspace"}}{{.Source}}{{end}}{{end}}' "$cid" 2>/dev/null || true)"
            if [[ "$source" == "$GITHUB_WORKSPACE" ]]; then
              docker kill "$cid"
            fi
          done < <(docker ps -q --filter label=nexus-ci-build=1)

          # Delete previous contents as root, then restore ownership of the
          # workspace directory itself. Deleting only its children is not
          # sufficient when a prior container changed the mount-point owner.
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            sh -ec 'find /workspace -mindepth 1 -delete; chown "$HOST_UID:$HOST_GID" /workspace'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Detect UI changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(ui/|tools/nexus/build-ui-container\.sh$|\.github/workflows/nexus-ui\.yml$)'; then
            echo 'ui_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ui_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path ui/Cargo.toml --all -- --check

      - name: Check helper syntax
        run: |
          bash -n tools/nexus/build-install-ui.sh
          bash -n tools/nexus/build-ui-ci.sh
          bash -n tools/nexus/build-ui-container.sh
          bash -n tools/nexus/build-backend-container.sh
          bash -n tools/nexus/deploy-ui.sh
          bash -n tools/nexus/deploy-backend.sh
          bash -n tools/nexus/validate-domains-ci.sh

      - name: Enforce Nexus ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi
          printf '%s\n' "$changed"

          engine_changes="$(printf '%s\n' "$changed" | grep -E '^(server/|lib/|cli/|pdm-config/|pdm-api/)' || true)"
          forbidden="$(printf '%s\n' "$engine_changes" | grep -Ev '^server/src/api/nexus/|^server/src/api/mod.rs$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Nexus changes must not modify PDM engine paths outside the explicit Nexus backend seam:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi

          api_wiring="$(printf '%s\n' "$engine_changes" | grep '^server/src/api/mod.rs$' || true)"
          if [[ -n "$api_wiring" ]]; then
            grep -q '^pub mod nexus;' server/src/api/mod.rs
            grep -q 'nexus::domains::ROUTER' server/src/api/mod.rs
          fi

          if git rev-parse HEAD^1 >/dev/null 2>&1 && ! git diff --quiet HEAD^1 HEAD -- ui/src/lib.rs; then
            echo "ui/src/lib.rs must stay identical to upstream for this integration seam" >&2
            exit 1
          fi

      - name: Verify Nexus ownership seam
        shell: bash
        run: |
          set -euo pipefail
          test -f ui/src/nexus/mod.rs
          test -f ui/src/nexus/home.rs
          test -f ui/src/nexus/inventory.rs
          test -f server/src/api/nexus/mod.rs
          grep -q 'mod nexus;' ui/src/main_menu.rs
          grep -q 'NexusHome' ui/src/main_menu.rs
          grep -q 'NexusInventory' ui/src/main_menu.rs

      - name: Validate Domains & Hosting backend
        shell: bash
        run: bash tools/nexus/validate-domains-ci.sh

  package:
    name: Build PDM UI package
    needs: boundary
    if: needs.boundary.outputs.ui_changed == 'true'
    runs-on: self-hosted
    timeout-minutes: 45
    concurrency:
      group: nexus-ui-package-build
      cancel-in-progress: false
    steps:
      - name: Recover workspace ownership
        shell: bash
        run: |
          set -euo pipefail

          while read -r cid; do
            [[ -n "$cid" ]] || continue
            source="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/workspace"}}{{.Source}}{{end}}{{end}}' "$cid" 2>/dev/null || true)"
            if [[ "$source" == "$GITHUB_WORKSPACE" ]]; then
              docker kill "$cid"
            fi
          done < <(docker ps -q --filter label=nexus-ci-build=1)

          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            sh -ec 'find /workspace -mindepth 1 -delete; chown "$HOST_UID:$HOST_GID" /workspace'

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          docker container prune -f
          docker image prune -af
          docker builder prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2
          submodules: recursive

      - name: Restore UI Cargo cache
        uses: actions/cache@v4
        with:
          path: .cache/ui-target
          key: ui-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'ui/Cargo.toml', 'ui/debian/control') }}-${{ github.ref_name }}
          restore-keys: |
            ui-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'ui/Cargo.toml', 'ui/debian/control') }}-
            ui-cargo-${{ runner.os }}-

      - name: Build package in Debian Trixie
        id: package_build
        shell: bash
        run: |
          set -u
          mkdir -p artifacts

          run_build() {
            docker run --rm \
              --label nexus-ci-build=1 \
              --memory=7g \
              -e HOST_UID="$(id -u)" \
              -e HOST_GID="$(id -g)" \
              -e CARGO_TARGET_DIR=/workspace/.cache/ui-target \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              debian:trixie \
              bash tools/nexus/build-ui-container.sh
          }

          attempt=1
          max_attempts=3
          build_failed=false
          build_status=0

          while true; do
            echo "Nexus UI package build attempt ${attempt}/${max_attempts}"
            set +e
            set -o pipefail
            run_build 2>&1 | tee "artifacts/build-attempt-${attempt}.log"
            status=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            cp "artifacts/build-attempt-${attempt}.log" artifacts/build.log

            if [[ "$status" -eq 0 ]]; then
              break
            fi

            if [[ "$status" -ne 137 || "$attempt" -ge "$max_attempts" ]]; then
              build_failed=true
              build_status="$status"
              break
            fi

            echo "Build was killed with exit 137; restoring this workspace and retrying after runner pressure clears."
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace" \
              debian:trixie \
              chown -R "$(id -u):$(id -g)" /workspace
            docker container prune -f
            docker builder prune -f
            sleep 90
            attempt=$((attempt + 1))
          done

          echo "build_failed=$build_failed" >> "$GITHUB_OUTPUT"
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Restore workspace ownership after build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Publish build failure diagnostics
        if: always() && steps.package_build.outputs.build_failed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('artifacts/build.log', 'utf8');
            const lines = log.split(/\r?\n/);
            const errorStart = lines.findLastIndex(line => /(^|\s)(error(\[E\d+\])?:|error: could not compile|make(\[\d+\])?: \*\*\*)/.test(line));
            const start = errorStart >= 0 ? Math.max(0, errorStart - 35) : Math.max(0, lines.length - 120);
            const excerpt = lines.slice(start, Math.min(lines.length, start + 120)).join('\n').slice(-50000);
            const marker = '<!-- nexus-ui-build-diagnostics -->';
            const body = `${marker}\n### Nexus UI build diagnostics\n\nCommit: \`${context.sha}\`\nBuild exit status: \`${{ steps.package_build.outputs.build_status }}\`\n\n\`\`\`text\n${excerpt}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail when package build fails
        if: always() && steps.package_build.outputs.build_failed == 'true'
        shell: bash
        run: |
          echo "Nexus UI package build failed with exit status ${{ steps.package_build.outputs.build_status }}" >&2
          exit 1

      - name: Validate artifact provenance
        if: steps.package_build.outputs.build_failed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/BUILD_COMMIT)" = "$GITHUB_SHA"
          (cd artifacts && sha256sum --check SHA256SUMS)
          dpkg-deb --info artifacts/proxmox-datacenter-manager-ui_*.deb >/dev/null

      - name: Upload commit-addressed package
        if: steps.package_build.outputs.build_failed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pdm-ui-${{ github.sha }}
          path: |
            artifacts/*.deb
            artifacts/SHA256SUMS
            artifacts/BUILD_COMMIT
          if-no-files-found: error
          retention-days: 30
