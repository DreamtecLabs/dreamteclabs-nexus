name: Nexus UI

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'server/src/api/nexus/**'
      - 'server/src/api/mod.rs'
      - 'services/nexus-domains-helper'
      - 'services/Makefile'
      - 'debian/proxmox-datacenter-manager.install'
      - 'tools/nexus/**'
      - 'docs/nexus-frontend-architecture.md'
      - 'docs/nexus-domains-hosting.md'
      - '.github/workflows/nexus-ui.yml'
      - '.github/workflows/domains-hosting.yml'
  push:
    branches:
      - master
    paths:
      - 'ui/**'
      - 'server/src/api/nexus/**'
      - 'server/src/api/mod.rs'
      - 'services/nexus-domains-helper'
      - 'services/Makefile'
      - 'debian/proxmox-datacenter-manager.install'
      - 'tools/nexus/**'
      - 'docs/nexus-frontend-architecture.md'
      - 'docs/nexus-domains-hosting.md'
      - '.github/workflows/nexus-ui.yml'
      - '.github/workflows/domains-hosting.yml'
  workflow_dispatch:

concurrency:
  group: nexus-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  boundary:
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      ui_changed: ${{ steps.changes.outputs.ui_changed }}
      domains_changed: ${{ steps.changes.outputs.domains_changed }}
    steps:
      - name: Recover workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            sh -c 'chown -R "$HOST_UID:$HOST_GID" /workspace'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Nexus changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi
          if printf '%s\n' "$changed" | grep -q '^ui/'; then
            echo 'ui_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ui_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(server/src/api/nexus/|server/src/api/mod.rs$|services/nexus-domains-helper$|services/Makefile$|debian/proxmox-datacenter-manager.install$|docs/nexus-domains-hosting.md$|\.github/workflows/domains-hosting.yml$)'; then
            echo 'domains_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'domains_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path ui/Cargo.toml --all -- --check

      - name: Check helper syntax
        run: |
          bash -n tools/nexus/build-install-ui.sh
          bash -n tools/nexus/build-ui-ci.sh
          bash -n tools/nexus/build-ui-container.sh
          bash -n tools/nexus/deploy-ui.sh

      - name: Enforce Nexus ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi
          printf '%s\n' "$changed"

          engine_changes="$(printf '%s\n' "$changed" | grep -E '^(server/|lib/|cli/|pdm-config/|pdm-api/)' || true)"
          forbidden="$(printf '%s\n' "$engine_changes" | grep -Ev '^server/src/api/nexus/|^server/src/api/mod.rs$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Nexus changes must not modify PDM engine paths outside the explicit Nexus backend seam:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi

          api_wiring="$(printf '%s\n' "$engine_changes" | grep '^server/src/api/mod.rs$' || true)"
          if [[ -n "$api_wiring" ]]; then
            grep -q '^pub mod nexus;' server/src/api/mod.rs
            grep -q 'nexus::domains::ROUTER' server/src/api/mod.rs
          fi

          if git rev-parse HEAD^1 >/dev/null 2>&1 && ! git diff --quiet HEAD^1 HEAD -- ui/src/lib.rs; then
            echo "ui/src/lib.rs must stay identical to upstream for this integration seam" >&2
            exit 1
          fi

      - name: Verify Nexus ownership seam
        shell: bash
        run: |
          set -euo pipefail
          test -f ui/src/nexus/mod.rs
          test -f ui/src/nexus/home.rs
          test -f ui/src/nexus/inventory.rs
          test -f server/src/api/nexus/mod.rs
          grep -q 'mod nexus;' ui/src/main_menu.rs
          grep -q 'NexusHome' ui/src/main_menu.rs
          grep -q 'NexusInventory' ui/src/main_menu.rs

  domains:
    name: Validate Domains & Hosting backend
    needs: boundary
    if: needs.boundary.outputs.domains_changed == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ runner.temp }}/nexus-domains-cargo
    steps:
      - name: Recover workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            sh -c 'chown -R "$HOST_UID:$HOST_GID" /workspace'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Use normal Cargo registry in CI
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .cargo/config.toml ]]; then
            mv .cargo/config.toml .cargo/config.toml.debian-package-build
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check domains helper syntax and ownership guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n services/nexus-domains-helper
          grep -q 'forbid_webmail_ddns' server/src/api/nexus/domains.rs
          grep -q 'forbid_mail_proxy' server/src/api/nexus/domains.rs
          grep -q 'webmail hostname is still DDNS-managed' services/nexus-domains-helper
          if grep -Eq 'cf_upsert_single_dns .* A .*mail_host' services/nexus-domains-helper; then
            echo 'mail.* A records must remain DDNS-owned' >&2
            exit 1
          fi

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test domains API unit tests
        run: cargo test -p server api::nexus::domains::tests --lib

      - name: Check server compilation
        run: cargo check -p server

  package:
    name: Build PDM UI package
    needs: boundary
    if: needs.boundary.outputs.ui_changed == 'true'
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Recover workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            sh -c 'chown -R "$HOST_UID:$HOST_GID" /workspace'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2
          submodules: recursive

      - name: Build package in Debian Trixie
        id: package_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          docker run --rm \
            --memory=7g \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:trixie \
            bash tools/nexus/build-ui-container.sh 2>&1 | tee artifacts/build.log

      - name: Publish build failure diagnostics
        if: steps.package_build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('artifacts/build.log', 'utf8');
            const lines = log.split(/\r?\n/);
            const errorStart = lines.findLastIndex(line => /(^|\s)(error(\[E\d+\])?:|error: could not compile|make(\[\d+\])?: \*\*\*)/.test(line));
            const start = errorStart >= 0 ? Math.max(0, errorStart - 35) : Math.max(0, lines.length - 120);
            const excerpt = lines.slice(start, Math.min(lines.length, start + 120)).join('\n').slice(-50000);
            const marker = '<!-- nexus-ui-build-diagnostics -->';
            const body = `${marker}\n### Nexus UI build diagnostics\n\nCommit: \`${context.sha}\`\n\n\`\`\`text\n${excerpt}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail when package build fails
        if: steps.package_build.outcome == 'failure'
        run: exit 1

      - name: Validate artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/BUILD_COMMIT)" = "$GITHUB_SHA"
          (cd artifacts && sha256sum --check SHA256SUMS)
          dpkg-deb --info artifacts/proxmox-datacenter-manager-ui_*.deb >/dev/null

      - name: Upload commit-addressed package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pdm-ui-${{ github.sha }}
          path: |
            artifacts/*.deb
            artifacts/SHA256SUMS
            artifacts/BUILD_COMMIT
          if-no-files-found: error
          retention-days: 30
