name: Nexus UI

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'tools/nexus/**'
      - 'docs/nexus-frontend-architecture.md'
      - '.github/workflows/nexus-ui.yml'
  push:
    branches:
      - master
    paths:
      - 'ui/**'
      - 'tools/nexus/**'
      - 'docs/nexus-frontend-architecture.md'
      - '.github/workflows/nexus-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ui_changed: ${{ steps.changes.outputs.ui_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect UI changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi
          if printf '%s\n' "$changed" | grep -q '^ui/'; then
            echo 'ui_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ui_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path ui/Cargo.toml --all -- --check

      - name: Check helper syntax
        run: |
          bash -n tools/nexus/build-install-ui.sh
          bash -n tools/nexus/build-ui-ci.sh
          bash -n tools/nexus/build-ui-container.sh
          bash -n tools/nexus/deploy-ui.sh

      - name: Enforce frontend-only boundary
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi
          printf '%s\n' "$changed"

          forbidden="$(printf '%s\n' "$changed" | grep -E '^(server/|lib/|cli/|pdm-config/|pdm-api/)' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Nexus UI changes must not modify PDM engine paths:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi

          if git rev-parse HEAD^1 >/dev/null 2>&1 && ! git diff --quiet HEAD^1 HEAD -- ui/src/lib.rs; then
            echo "ui/src/lib.rs must stay identical to upstream for this integration seam" >&2
            exit 1
          fi

      - name: Verify Nexus ownership seam
        shell: bash
        run: |
          set -euo pipefail
          test -f ui/src/nexus/mod.rs
          test -f ui/src/nexus/home.rs
          test -f ui/src/nexus/inventory.rs
          grep -q 'mod nexus;' ui/src/main_menu.rs
          grep -q 'NexusHome' ui/src/main_menu.rs
          grep -q 'NexusInventory' ui/src/main_menu.rs

  package:
    name: Build PDM UI package
    needs: boundary
    if: needs.boundary.outputs.ui_changed == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2
          submodules: recursive

      - name: Build Debian package on Trixie runner
        run: bash tools/nexus/build-ui-ci.sh

      - name: Validate artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/BUILD_COMMIT)" = "$GITHUB_SHA"
          (cd artifacts && sha256sum --check SHA256SUMS)
          dpkg-deb --info artifacts/proxmox-datacenter-manager-ui_*.deb >/dev/null

      - name: Upload commit-addressed package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pdm-ui-${{ github.sha }}
          path: |
            artifacts/*.deb
            artifacts/SHA256SUMS
            artifacts/BUILD_COMMIT
          if-no-files-found: error
          retention-days: 30
