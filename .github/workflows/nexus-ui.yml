name: Nexus UI

on:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/nexus-ui.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path ui/Cargo.toml --all -- --check

      - name: Check Nexus UI
        run: cargo check --manifest-path ui/Cargo.toml --target wasm32-unknown-unknown
