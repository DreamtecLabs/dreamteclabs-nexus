name: Nexus Monitoring

on:
  pull_request:
    paths:
      - 'server/src/api/nexus/monitoring/**'
      - 'server/src/api/nexus/mod.rs'
      - 'server/src/api/mod.rs'
      - 'ui/src/nexus/monitoring.rs'
      - 'ui/src/nexus/mod.rs'
      - 'ui/src/main_menu.rs'
      - 'services/nexus-icmp-collector.service'
      - 'services/nexus-icmp-collector-runtime.yaml'
      - 'services/prometheus-blackbox-exporter-nexus.conf'
      - 'services/prometheus-blackbox-exporter-nexus-sysctl.conf'
      - 'services/Makefile'
      - 'debian/control'
      - 'debian/proxmox-datacenter-manager.install'
      - 'debian/proxmox-datacenter-manager.postinst'
      - 'docs/nexus-monitoring.md'
      - 'tools/nexus/validate-monitoring-ci.sh'
      - 'tools/nexus/validate-domains-container.sh'
      - 'tools/nexus/build-backend-container.sh'
      - '.github/workflows/monitoring.yml'
  push:
    branches:
      - master
    paths:
      - 'server/src/api/nexus/monitoring/**'
      - 'server/src/api/nexus/mod.rs'
      - 'server/src/api/mod.rs'
      - 'ui/src/nexus/monitoring.rs'
      - 'ui/src/nexus/mod.rs'
      - 'ui/src/main_menu.rs'
      - 'services/nexus-icmp-collector.service'
      - 'services/nexus-icmp-collector-runtime.yaml'
      - 'services/prometheus-blackbox-exporter-nexus.conf'
      - 'services/prometheus-blackbox-exporter-nexus-sysctl.conf'
      - 'services/Makefile'
      - 'debian/control'
      - 'debian/proxmox-datacenter-manager.install'
      - 'debian/proxmox-datacenter-manager.postinst'
      - 'docs/nexus-monitoring.md'
      - 'tools/nexus/validate-monitoring-ci.sh'
      - 'tools/nexus/validate-domains-container.sh'
      - 'tools/nexus/build-backend-container.sh'
      - '.github/workflows/monitoring.yml'
  workflow_dispatch:

concurrency:
  group: nexus-monitoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Recover workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          # This job never writes root-owned files itself, but self-hosted
          # runners reuse the same per-repo workspace across workflows. A
          # cancelled nexus-ui/domains-hosting build container can leave it
          # root-owned, which would break this job's checkout too.
          docker ps -q --filter label=nexus-ci-build | xargs -r docker kill
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:trixie \
            find /workspace -mindepth 1 -delete

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate Monitoring ownership and formatting
        run: bash tools/nexus/validate-monitoring-ci.sh
