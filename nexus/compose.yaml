services:
  nexus-core:
    build: .
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 15s
    # Pass every setting straight through from .env instead of hand-listing each
    # one here: the hand-listed version silently fell out of sync every time a
    # new Settings field was added in config.py (most recently: all of Power,
    # Provisioning, Domains, and the Cloudflare DNS/tunnel management vars).
    # NEXUS_DATA_DIR is still overridden below since the container-internal
    # path must match the volume mount regardless of what .env's host-side
    # value says.
    env_file:
      - .env
    environment:
      NEXUS_DATA_DIR: /var/lib/dreamteclabs-nexus
    volumes:
      - /var/lib/dreamteclabs-nexus:/var/lib/dreamteclabs-nexus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  nexus-otel:
    image: otel/opentelemetry-collector-contrib:0.139.0
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 15s
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      SIGNOZ_OTLP_ENDPOINT: ${SIGNOZ_OTLP_ENDPOINT:-192.168.0.47:4317}
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/dreamteclabs-nexus:/var/lib/dreamteclabs-nexus:ro
