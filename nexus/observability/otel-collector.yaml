receivers:
  prometheus/nexus_services:
    config:
      scrape_configs:
        - job_name: nexus-managed-services
          file_sd_configs:
            - files:
                - /var/lib/dreamteclabs-nexus/prometheus/monitoring-targets.json
              refresh_interval: 10s

exporters:
  otlp/signoz:
    endpoint: ${env:SIGNOZ_OTLP_ENDPOINT}
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers:
        - prometheus/nexus_services
      exporters:
        - otlp/signoz
